[mcp_servers.reklamzeka]
command = "node"
args = ["--import", "tsx", "scripts/reklamzeka-mcp.ts"]
enabled = true
required = true
startup_timeout_sec = 15
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
enabled_tools = [
  "register_agent_session",
  "heartbeat_agent_session",
  "get_handoff_context",
  "decision_room_list",
  "decision_room_mark_inbox_read",
  "approval_queue_list",
  "approval_queue_get",
  "policy_bundle_read",
  "budget_lab_list",
  "budget_lab_get",
  "budget_lab_dry_run",
  "budget_lab_save_draft",
  "practice_lab_list",
  "practice_lab_get",
  "practice_lab_prepare_draft",
  "guidance_registry_list",
  "guidance_effective_preview",
  "existing_post_promotion_preflight",
]

[mcp_servers.reklamzeka.tools.register_agent_session]
approval_mode = "auto"

[mcp_servers.reklamzeka.tools.heartbeat_agent_session]
approval_mode = "auto"

[mcp_servers.reklamzeka.tools.get_handoff_context]
approval_mode = "auto"
