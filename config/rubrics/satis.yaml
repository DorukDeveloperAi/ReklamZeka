# Rubrik varsayılanı — amaç kapsamı: satış (MASTER §5)
# v1'de yalnız piksel-görünür dönüşüm; offline/CRM kısmı v2'ye kadar
# 'ölçülemedi' raporlanır — tahmin YAZILMAZ (kullanıcı kararı 2, MASTER §9.5).
goal_scope: satis
metrics:
  - metric_key: cpa
    source: ads_insights
    direction: minimize
    weight: 0.35
    benchmark: null
  - metric_key: roas
    source: ads_insights       # action_values / spend (yalnız piksel-görünür)
    direction: maximize
    weight: 0.30
    benchmark: null
    notes: "Offline satış dahil değil → v2 CRM kapısına kadar alt-sınır olarak oku"
  - metric_key: conversion_volume
    source: ads_insights
    direction: maximize
    weight: 0.20
    benchmark: null
  - metric_key: funnel_dropoff
    source: derived            # huni adımları arası düşüş oranı
    direction: minimize
    weight: 0.15
    benchmark: null
