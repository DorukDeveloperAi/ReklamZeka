# Rubrik varsayılanı — amaç kapsamı: takipçi (MASTER §5)
# Takipçi atfı API'de zayıf: follows alanı teyitsiz; organik delta-korelasyon
# modeli 'derived' metriktir ve güven etiketi düşüktür (MASTER §9.3).
goal_scope: takipci
metrics:
  - metric_key: follows
    source: ads_insights
    direction: maximize
    weight: 0.30
    benchmark: null
    confidence: dusuk
    notes: "Ads Insights'ta alan adı teyitsiz (docs/api-gercekleri.md #2) — Faz 0'da doğrula"
  - metric_key: follower_delta_correlated
    source: derived            # organik follower_count deltası × reklam takvimi
    direction: maximize
    weight: 0.30
    benchmark: null
    confidence: dusuk
  - metric_key: profile_visits
    source: ig_platform        # organik uç (Aralık 2025'te eklendi)
    direction: maximize
    weight: 0.20
    benchmark: null
  - metric_key: cost_per_follower
    source: derived            # spend / (follows ∥ follower_delta_correlated)
    direction: minimize
    weight: 0.20
    benchmark: null
