# ReklamZeka ayarları — kopyala: config/settings.yaml (git'e girmez)
meta:
  mcp_endpoint: "https://mcp.facebook.com/ads"   # resmî Meta Ads MCP (kullanıcı kararı: tek plumbing)
  api_version_note: "v26.0 (2026-08 itibarıyla; yılda ~1 zorunlu sürüm göçü — MASTER §9.6)"
  # OAuth token'ı buraya YAZILMAZ; META_MCP_ACCESS_TOKEN ortam değişkeni ya da
  # interaktif MCP istemci konfigürasyonu kullanılır.

sheets:
  spreadsheet_id: ""            # kanon Sheet — Faz 0 kullanıcı adımı
  credentials_path: ""          # service account JSON yolu (git'e girmez)

warehouse:
  db_path: "warehouse.db"

guardrails:
  dry_run: true                 # Faz 2'ye kadar tüm yazmalar dry-run
  daily_spend_cap_try: null     # kullanıcı belirleyecek (MASTER §10 soru 7)
  monthly_spend_cap_try: null
  max_budget_change_pct: 50     # tek diff'te bütçe değişim sınırı ±%

cadence:
  daily: "ingest+evaluate"
  weekly: "aggregate+budget+digest"

telegram:
  bot_token_env: "REKLAMZEKA_TG_TOKEN"
  chat_id: ""                   # digest kanalı (onay Telegram'dan YAPILMAZ)
